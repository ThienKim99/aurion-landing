<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Aurion Elite Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#114265;--gold:#dfb160;--cream:#fbf7ef;--ink:#1c2b38;--sans:'Noto Sans',sans-serif;--serif:'Noto Serif',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#f0f2f5;color:var(--ink)}
.topbar{background:var(--navy);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-family:var(--serif);color:var(--gold);font-size:1.1rem}
.topbar .refresh{background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:.85rem}
.topbar .refresh:hover{background:rgba(255,255,255,.25)}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2dbd0;padding:0 24px}
.tab-btn{padding:14px 22px;border:none;background:none;font-family:var(--sans);font-size:.95rem;font-weight:600;color:#6b7a86;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy)}
.content{padding:24px;max-width:1100px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.toolbar h2{font-family:var(--serif);color:var(--navy);font-size:1.2rem}
.btn{padding:9px 18px;border-radius:6px;border:none;font-family:var(--sans);font-size:.88rem;font-weight:700;cursor:pointer}
.btn-navy{background:var(--navy);color:#fff}
.btn-sm{padding:6px 12px;font-size:.82rem;border-radius:4px}
.btn-green{background:#1a7a4a;color:#fff}
.card{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(17,66,101,.08);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f5f0e6;color:var(--navy);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left;white-space:nowrap}
td{padding:12px 14px;font-size:.9rem;border-top:1px solid #f0ebe0;vertical-align:middle}
tr:hover td{background:#fdfaf4}
.badge{padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;display:inline-block}
.badge-pending{background:#fff8e6;color:#b8860b}
.badge-success{background:#e8f8ef;color:#1a7a4a}
.badge-mismatch{background:#fde8dc;color:#c0392b;border:1px solid #f0b399;font-weight:800}
.empty,.loading{text-align:center;padding:40px;color:#8a7f6a}
@media(max-width:600px){.tabs{padding:0 12px}.content{padding:14px}.tab-btn{padding:12px 14px;font-size:.88rem}th,td{padding:9px 10px;font-size:.82rem}}
</style>
</head>
<body>
<div class="topbar">
  <h1>Admin Panel — Aurion Elite Travel</h1>
  <button class="refresh" onclick="loadAll()">🔄 Làm mới</button>
</div>
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('orders',this)">📦 Đơn hàng</button>
  <button class="tab-btn" onclick="switchTab('customers',this)">👤 Khách hàng</button>
  <button class="tab-btn" onclick="switchTab('products',this)">🏷️ Sản phẩm</button>
</div>
<div class="content">
  <div id="panel-orders" class="panel active">
    <div class="toolbar"><h2>Quản lý đơn hàng</h2></div>
    <div class="card">
      <table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Sản phẩm</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày tạo</th><th>Thao tác</th></tr></thead>
        <tbody id="bodyOrders"><tr><td colspan="7" class="loading">⏳ Đang tải...</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-customers" class="panel">
    <div class="toolbar"><h2>Quản lý khách hàng</h2></div>
    <div class="card">
      <table><thead><tr><th>Họ tên</th><th>Điện thoại</th><th>Email</th><th>Lĩnh vực</th><th>Ngày đăng ký</th></tr></thead>
        <tbody id="bodyCustomers"><tr><td colspan="5" class="loading">⏳ Đang tải...</td></tr></tbody></table>
    </div>
  </div>
  <div id="panel-products" class="panel">
    <div class="toolbar"><h2>Quản lý sản phẩm</h2></div>
    <div class="card">
      <table><thead><tr><th>Tên sản phẩm</th><th>Loại</th><th>Giá</th><th>Tồn kho</th></tr></thead>
        <tbody id="bodyProducts"><tr><td colspan="4" class="loading">⏳ Đang tải...</td></tr></tbody></table>
    </div>
  </div>
</div>
 
<script>
var API="/.netlify/functions/order";
 
async function loadAll(){await Promise.all([loadOrders(),loadCustomers(),loadProducts()]);}
 
async function loadOrders(){
  var tb=document.getElementById("bodyOrders");
  try{
    var r=await fetch(API+"?action=orders");
    var orders=await r.json();
    if(!orders.length){tb.innerHTML='<tr><td colspan="7" class="empty">Chưa có đơn hàng nào. Đơn sẽ tự tạo khi khách submit form thanh toán.</td></tr>';return;}
    tb.innerHTML=orders.map(function(o){
      return '<tr><td><code style="font-size:.8rem">'+o.orderCode+'</code></td>'
        +'<td><strong>'+(o.name||'—')+'</strong><br><span style="color:#8a7f6a;font-size:.8rem">'+(o.phone||'')+'</span></td>'
        +'<td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(o.product||'—')+'</td>'
        +'<td><strong>'+fmtMoney(o.amount)+'</strong></td>'
        +'<td>'+badge(o.status)+(o.status==='mismatch'?'<br><span style="color:#c0392b;font-size:.76rem">Nhận '+fmtMoney(o.receivedAmount)+' / cần '+fmtMoney(o.amount)+'</span>':'')+'</td>'
        +'<td style="font-size:.82rem">'+fmtDate(o.createdAt)+'</td>'
        +'<td>'+(o.status!=='success'?'<button class="btn btn-sm btn-green" onclick="markPaid(\''+o.orderCode+'\')">✓ Đã TT</button>':'—')+'</td></tr>';
    }).join('');
  }catch(e){tb.innerHTML='<tr><td colspan="7" class="empty">Lỗi tải dữ liệu.</td></tr>';}
}
 
async function loadCustomers(){
  var tb=document.getElementById("bodyCustomers");
  try{
    var r=await fetch(API+"?action=customers");
    var list=await r.json();
    if(!list.length){tb.innerHTML='<tr><td colspan="5" class="empty">Chưa có khách hàng.</td></tr>';return;}
    tb.innerHTML=list.map(function(c){
      return '<tr><td><strong>'+(c.name||'—')+'</strong></td><td>'+(c.phone||'—')+'</td><td>'+(c.email||'—')+'</td><td>'+(c.sector||'—')+'</td><td>'+fmtDate(c.createdAt)+'</td></tr>';
    }).join('');
  }catch(e){tb.innerHTML='<tr><td colspan="5" class="empty">Lỗi tải dữ liệu.</td></tr>';}
}
 
async function loadProducts(){
  var tb=document.getElementById("bodyProducts");
  try{
    var r=await fetch(API+"?action=products");
    var list=await r.json();
    var typeMap={service:"Dịch vụ / Tour",digital:"Sản phẩm số",physical:"Sản phẩm vật lý"};
    tb.innerHTML=list.map(function(p){
      return '<tr><td><strong>'+(p.name||'—')+'</strong><br><span style="color:#8a7f6a;font-size:.8rem">'+(p.desc||'')+'</span></td>'
        +'<td>'+(typeMap[p.type]||p.type)+'</td><td><strong>'+fmtMoney(p.price)+'</strong></td>'
        +'<td>'+(p.type==='physical'?(p.stock||0)+' cái':'—')+'</td></tr>';
    }).join('');
  }catch(e){tb.innerHTML='<tr><td colspan="4" class="empty">Lỗi tải dữ liệu.</td></tr>';}
}
 
async function markPaid(code){
  if(!confirm('Xác nhận đơn '+code+' đã thanh toán?'))return;
  try{
    await fetch(API+"?action=markpaid&code="+code);
    await loadOrders();
  }catch(e){alert('Lỗi cập nhật.');}
}
 
function fmtMoney(n){return Number(n).toLocaleString('vi-VN')+"đ";}
function fmtDate(s){if(!s)return"—";return new Date(s).toLocaleDateString('vi-VN');}
function badge(s){var m={pending:"Chờ thanh toán",success:"Đã thanh toán",mismatch:"⚠️ Sai số tiền"};return'<span class="badge badge-'+s+'">'+(m[s]||s)+'</span>';}
function switchTab(t,el){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); document.getElementById('panel-'+t).classList.add('active');
}
 
loadAll();
setInterval(loadAll, 15000); // auto refresh mỗi 15s
</script>
</body>
</html>
